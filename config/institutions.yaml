notes: 【民族学博士点核实说明】已核实为true的依据：中央民族大学/中南民族大学/西南民族大学/云南大学/兰州大学/中山大学/厦门大学/四川大学（第四轮学科评估'博士授权'高校及各校学科页面）、云南民族大学（校新闻：民族学一级学科博士点+博士后流动站）、广西民族大学（2013年获民族学一级博士点）、内蒙古大学（学院简介：民族学博士一级学科）、宁夏大学（2011年民族学一级博士点）、西北民族大学（中华民族共同体学院2025年博士招生）、青海民族大学（2024民族学博士招生简章）、北方民族大学（2019年新增民族学一级博士点）、吉首大学（2023年度审核增列，2024年公布）、内蒙古师范大学（学院简介：民族学一级学科博士点）、中国社会科学院大学（民族学系依托民族学与人类学研究所）。标注unknown的：新疆大学（检索仅见2022年民族学学位点报告由历史学院调整至马克思主义学院，未能确认是否为博士点）、贵州民族大学（学院概况仅显示民族学一级硕士点+服务国家特殊需求博士项目）、西藏民族大学（民族研究院页面显示民族学、中国史两个硕士一级学科，博导2人）、湖北民族大学（有二级教授博导，但未见民族学博士点授权证据）、云南师范大学/西藏大学/新疆师范大学/青海师范大学（未检索到民族学博士点证据，很可能为false）、暨南大学（未见民族学博士点，但为中华民族共同体学交叉学科试点）。大连民族大学2018年仅获民族学硕士点，标false。【中华民族共同体学】目前以'交叉学科'（国务院学位办复函国家民委）与'民族学目录外二级学科'形式设置，尚非一级学科。试点格局'1+15'：中央民族大学（2024-05首个）；第二批（2025-04）中国人民大学、武汉大学、南京大学、山东大学、西安交通大学、暨南大学、新疆大学、内蒙古师范大学、延边大学、黑龙江大学、中南民族大学、西南民族大学、西北民族大学、云南民族大学、广西民族大学。这些高校community_phd标true（试点含博士培养，中央民族大学、中南民族大学、西北民族大学已招收博士）。其余单位标unknown。【研究基地】四部委首批(2020)研究基地10家：北京大学、东南大学、广西民族大学、华中科技大学、暨南大学、四川大学、新疆大学、云南大学、中国社会科学院、中央民族大学；培育基地5家：北京师范大学、清华大学、兰州大学、内蒙古大学、浙江大学。第二轮(2023—2025)共28家，检索确认含中南民族大学、南京大学、兰州大学、暨南大学、北京大学、中国传媒大学、西北大学等，完整名单未获取。第三批(2026-05公布)确认含宁夏大学、南京大学、同济大学、湖南师范大学，完整名单未获取。国家民委中华民族共同体研究基地(2024—2026周期)共50家，确认含云南民族大学、中南民族大学、中山大学、山东大学、海南大学、河南大学，完整名单未获取。【学者未核实单位】西南民族大学（检索结果被湖北民族大学页面混淆，未获得可靠姓名）、新疆大学、北方民族大学、吉首大学、贵州民族大学（仅见副教授陈文元）、大连民族大学、云南师范大学、西藏大学、新疆师范大学、青海师范大学、以及第二批试点中的中国人民大学/武汉大学/南京大学/山东大学/西安交大/延边大学/黑龙江大学未做学者检索。内蒙古师范大学两位学者仅见师资页面，职称未在摘要中显示。中南民族大学院长信息存在时间差异（陈祥军为现任院长页面）。搜索共使用45次，教育部/学位办PDF无法直接打开，仅依赖摘要。
