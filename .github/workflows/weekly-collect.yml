name: 民族学监测·每周采集

# 无需任何密钥：GitHub 托管运行器可直连国内学术/政务站点，采集结果提交到 data/collected/，
# 供每周一的 Claude Routine 会话读取、分析并推送 Gmail。
on:
  schedule:
    # 每周一 06:30 北京时间（UTC 周日 22:30）
    - cron: "30 22 * * 0"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "监测窗口天数（默认取 config/sources.yaml）"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: ethno-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 采集并诊断
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: |
          mkdir -p data/collected
          python -m ethno_monitor collect --out data/collected/latest.json --diagnose 2>&1 | tee collect.log
          cp data/collected/latest.json "data/collected/$(date -u +%Y-%m-%d).json"
      - name: 上传日志与页面快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect-${{ github.run_number }}
          path: |
            collect.log
            debug/
            data/collected/latest.json
          retention-days: 30
      - name: 提交采集结果
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collected
          if git diff --cached --quiet; then echo "无变更"; else
            git commit -m "chore(collect): 采集结果 $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
