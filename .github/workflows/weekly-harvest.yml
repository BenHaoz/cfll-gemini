name: 民族学监测·三年发文抓取

# 无需密钥：在 GitHub 运行器上按核心期刊×年份×期号抓取文献中心期刊页与文献详情页，
# 增量写入 data/pubs/articles.jsonl（每次预算有限，多次运行后收敛）。
on:
  schedule:
    - cron: "30 20 * * 0"     # 每周一 04:30 北京时间
  workflow_dispatch:
    inputs:
      max_issues:
        description: "本次最多抓取的期页数"
        type: string
        default: "80"
      max_details:
        description: "本次最多抓取的详情页数"
        type: string
        default: "400"
      journal:
        description: "只抓名称包含该字符串的期刊（可选）"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: ethno-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 抓取
        run: |
          ARGS="--max-issues ${{ inputs.max_issues || '80' }} --max-details ${{ inputs.max_details || '400' }}"
          if [ -n "${{ inputs.journal }}" ]; then ARGS="$ARGS --journal ${{ inputs.journal }}"; fi
          python -m ethno_monitor harvest $ARGS 2>&1 | tee harvest.log
          python -m ethno_monitor stats > data/pubs/stats_preview.md || true
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-${{ github.run_number }}
          path: |
            harvest.log
            data/pubs/stats_preview.md
          retention-days: 30
      - name: 提交文章库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pubs
          if git diff --cached --quiet; then echo "无变更"; else
            git commit -m "chore(harvest): 文章库更新 $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
