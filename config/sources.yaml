# 民族学学科监测系统 —— 数据源配置
# 说明：
#   * 每个数据源都是"尽力而为"，抓取失败不会中断整个流程，只会在周报的"数据源状态"表中标红。
#   * 站点改版时，只需修改这里的 URL / 选择器 / 正则，不必改代码。
#   * lookback_days: 只保留监测窗口内的条目（无法解析日期的条目也保留，但由 state 去重）。

lookback_days: 14

# ---------------------------------------------------------------------------
# 一、期刊（民族学类 CSSCI 来源期刊）
# ---------------------------------------------------------------------------
journals:
  - name: 民族研究
    sponsor: 中国社会科学院民族学与人类学研究所
    aliases: [民族研究]
    # 官方网站（若有 CNKI 腾云采编系统或自建站点，可在此填写目录页）
    toc_pages:
      - url: https://m.ncpssd.cn/journal/details?gch=80294X&nav=1&langType=1
        parser: ncpssd_journal
  - name: 中华民族共同体研究
    sponsor: 中央民族大学
    aliases: [中华民族共同体研究]
    toc_pages: []
  - name: 中央民族大学学报（哲学社会科学版）
    sponsor: 中央民族大学
    aliases: [中央民族大学学报, 中央民族大学学报(哲学社会科学版)]
    toc_pages:
      - url: https://m.ncpssd.cn/journal/details?gch=96982A&nav=1&langType=1
        parser: ncpssd_journal
  - name: 西北民族研究
