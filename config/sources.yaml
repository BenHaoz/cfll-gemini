    aliases: [广西民族研究]
    toc_pages: []   # 文献中心 gch=90751A 经核对并非本刊；知网采编系统有验证码。待补充可抓取目录页
  - name: 贵州民族研究
    sponsor: 贵州省民族研究院
    aliases: [贵州民族研究]
