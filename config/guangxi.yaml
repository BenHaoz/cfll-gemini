# 广西区域知识库 —— 供 LLM 选题策划与规则兜底使用
region:
  name: 广西壮族自治区
  positioning:
    - 全国民族团结进步示范区（2023年整体获评）、边疆民族地区、我国唯一沿海的民族自治区
    - 面向东盟开放合作的前沿窗口，西部陆海新通道门户，平陆运河建成通航后形成"江海联动"新格局
    - 中越陆地边境线约1020公里，8个边境县（市、区），边民、口岸、跨境民族问题突出
    - 拥有壮族（人口最多的少数民族）、瑶族（全国瑶族约60%）、京族（我国唯一海洋民族）等标志性民族
  twelve_ethnic_groups:
    - {name: 汉族, note: 内部含桂柳话、平话、客家、粤语（白话）、湘语等多个方言群体，"平话人"研究是汉族族群多样性的经典案例}
    - {name: 壮族, note: 人口最多的少数民族，壮侗（侗台）语族，那文化（稻作）、铜鼓、花山岩画、三月三、壮锦、师公戏、布洛陀；与越南岱族、侬族同源跨境}
    - {name: 瑶族, note: 全国瑶族约六成在广西，盘瑶、布努瑶、茶山瑶、平地瑶等支系众多；盘王节、密洛陀、过山榜；与越南、老挝、泰国瑶族跨境}
    - {name: 苗族, note: 融水、隆林、资源等地；坡会、芦笙、苗年；与东南亚苗族（Hmong）联系}
    - {name: 侗族, note: 三江、龙胜；侗族大歌、鼓楼、风雨桥、款组织、萨岁信仰；桂湘黔交界文化圈}
    - {name: 仫佬族, note: 罗城仫佬族自治县是全国唯一的仫佬族自治县；依饭节、走坡}
    - {name: 毛南族, note: 环江毛南族自治县；肥套（还愿）仪式、花竹帽、分龙节；整族脱贫典型}
    - {name: 回族, note: 桂林、柳州、南宁等城市散居；城市民族工作、清真饮食与社区}
    - {name: 京族, note: 东兴"京族三岛"（万尾、巫头、山心），我国唯一海洋民族；哈节、独弦琴、喃字、海洋渔业、边境贸易；与越南京族跨境}
    - {name: 彝族, note: 隆林、那坡等地；跳弓节、火把节；滇桂交界彝族支系}
    - {name: 水族, note: 南丹、宜州等；水书、端节；与贵州三都水族联系}
    - {name: 仡佬族, note: 隆林等地；人口较少民族，语言濒危}
  nanling_corridor:
    summary: 费孝通提出的三大民族走廊（西北走廊、藏彝走廊、南岭走廊）之一，横贯桂湘粤赣闽五省区交界山地，以瑶族、壮族、苗族、侗族、畲族等民族的历史迁徙与交融为特征。
    themes:
      - 潇贺古道、灵渠、湘桂走廊与"岭南—中原"交往通道
      - 瑶族迁徙史、过山榜与走廊族群的历史记忆
      - 南岭走廊多民族"三交"的历史经验与当代形态
      - 走廊生态（石漠化治理、梯田农业、林业）与生计变迁
      - 走廊文化遗产的整体性保护（龙脊梯田、程阳八寨、黄姚古镇等）
      - 走廊沿线民族地区与粤港澳大湾区的协同发展
  southeast_asia:
    summary: 广西是东南亚民族研究的天然前沿，中越边境跨境民族、中国—东盟人文交流、北部湾—东南亚海洋文化圈是三大主线。
    themes:
      - 中越跨境民族（壮—岱/侬、京—越、瑶—瑶、苗—Hmong）的认同、通婚、贸易与治理
      - 壮侗（侗台）语族在中国、越南、老挝、泰国、缅甸的跨国分布与文化比较
      - 中国—东盟命运共同体建设中的民族文化交流与民心相通
      - 边境口岸（东兴、凭祥、龙邦、水口）与边民互市、边境经济合作区
      - 东南亚华侨华人与广西籍侨乡（容县、北流等）的跨国网络
      - 北部湾海洋民族（京族）与东南亚海洋文化的比较研究
      - 平陆运河、西部陆海新通道对边疆民族地区发展格局的重塑
  cultural_symbols: [花山岩画（世界文化遗产）, 铜鼓文化, 骆越/西瓯文化, 那文化, 刘三姐歌谣, 壮族三月三, 壮锦, 侗族大歌, 瑶族盘王节, 京族哈节与独弦琴, 毛南族肥套, 仫佬族依饭节, 忻城莫土司衙署, 程阳风雨桥, 龙脊梯田, 灵渠, 左右江革命老区, 湘江战役红色遗存]
  policy_context:
    - 建设铸牢中华民族共同体意识示范区，打造"广西经验"
    - 兴边富民行动、边境"三个一"（一个村庄/家庭/边民）稳边固边实践
    - 平陆运河、西部陆海新通道、面向东盟的金融开放门户
    - 民族语文工作（壮文推行与双语教育）、民族文化"走出去"
    - 石漠化片区、革命老区、边境地区乡村振兴衔接
  research_institutions: [广西民族大学, 广西民族研究中心（自治区民宗委）, 广西社会科学院民族研究所, 广西师范大学, 桂林理工大学, 百色学院, 河池学院, 广西大学中国—东盟研究院, 中央民族大学, 云南大学（西南边疆研究）]

